{% extends 'base.html' %}
{% block content %}
<h2>All Customers</h2>
<a href="{% url 'add_opportunity' %}" class="btn-add">Add Customer</a>
<table border="1" cellpadding="8">
    <tr>
        <th>Name</th><th>Email</th><th>Company</th>
    </tr>
    {% for customer in customers %}
    <tr>
        <td>{{ customer.name }}</td>
        <td>{{ customer.email }}</td>
        <td>{{ customer.company }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
