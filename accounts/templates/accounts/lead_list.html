{% extends 'base.html' %}
{% block content %}
<h2>All Leads</h2>
<a href="{% url 'add_lead' %}" class="btn-add"><i class="bi bi-plus-lg"></i> Add Lead</a>
<table>
    <tr>
        <th>Name</th><th>Email</th><th>Company</th><th>Action</th>
    </tr>
    {% for lead in leads %}
    <tr>
        <td>{{ lead.name }}</td>
        <td>{{ lead.email }}</td>
        <td>{{ lead.company }}</td>
        <td>
            <a href="{% url 'delete_lead' lead.id %}" 
               onclick="return confirm('Are you sure you want to delete this lead?');"
               class="delete-link">
               <i class="bi bi-trash3"></i> Delete
            </a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
