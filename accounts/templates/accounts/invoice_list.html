{% extends 'base.html' %}
{% block content %}
<h2>All Invoices</h2>
<a href="{% url 'add_opportunity' %}" class="btn-add">Add Invoice</a>
<table border="1" cellpadding="8">
    <tr>
        <th>Invoice #</th><th>Customer</th><th>Amount</th><th>Status</th>
    </tr>
    {% for inv in invoices %}
    <tr>
        <td>{{ inv.invoice_number }}</td>
        <td>{{ inv.customer }}</td>
        <td>{{ inv.amount }}</td>
        <td>{{ inv.get_status_display }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
